
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Frosty Bliss</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-container">

            <a href="index.html" class="logo">
                🍦 Frosty Bliss
            </a>

            <nav class="nav" id="mainNav">
                <a href="index.html">Home</a>
                <a href="index.html#products">Ice Creams</a>
                <a href="index.html#about">About</a>
                <a href="index.html#contact">Contact</a>

                <a href="cart.html">
                    🛒 Cart
                    <span id="cart-count">0</span>
                </a>

                <a href="login.html" class="active">
                    Login
                </a>
            </nav>

            <button class="menu-toggle" onclick="toggleMenu()">
                ☰
            </button>

        </div>
    </header>


    <!-- Login Section -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-icon">
                    🍦
                </div>

                <h1>Welcome Back!</h1>

                <p class="auth-subtitle">
                    Login to continue your Frosty Bliss journey.
                </p>


                <form id="login-form">

                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div id="login-message" class="form-message"></div>


                    <button type="submit" class="btn btn-primary auth-btn">
                        Login 🍨
                    </button>

                </form>


                <div class="auth-divider">
                    <span>or</span>
                </div>


                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>


                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">
                <p>
                    © 2026 Frosty Bliss. Made with ❤️ and lots of ice cream.
                </p>
            </div>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="../js/products.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        function toggleMenu() {
            const nav = document.getElementById("mainNav");
            nav.classList.toggle("active");
        }
    </script>

</body>
</html>
